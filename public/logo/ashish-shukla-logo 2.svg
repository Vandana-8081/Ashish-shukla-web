<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&amp;display=swap');
      .name-text {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-size: 136px;
        font-weight: 900;
        fill: #f58220;
        letter-spacing: 6px;
      }
      .sub-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: #9a7d46;
        letter-spacing: 3px;
      }
    </style>

    <!-- Center-tapered horizontal rule gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7d46" stop-opacity="0" />
      <stop offset="15%" stop-color="#9a7d46" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a8894d" stop-opacity="1" />
      <stop offset="85%" stop-color="#9a7d46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9a7d46" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="1920" height="1080" fill="#ffffff" />

  <!-- Main Name Text -->
  <text 
    x="960" 
    y="565" 
    text-anchor="middle" 
    class="name-text">ASHISH SHUKLA</text>

  <!-- Subtitle Text -->
  <text 
    x="960" 
    y="640" 
    text-anchor="middle" 
    class="sub-text">PUBLIC REPRESENTATIVE &#8226; BHAGWANTNAGAR, UNNAO</text>

  <!-- Elegant Tapered Accent Line -->
  <path 
    d="M 220 682 Q 960 679 1700 682 Q 960 686 220 682 Z" 
    fill="url(#dividerGrad)" />
</svg>
